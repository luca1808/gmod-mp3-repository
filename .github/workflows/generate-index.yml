name: Generate index.html for music files

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Generate index.html
      run: |
        cat > index.html <<EOF
        <!DOCTYPE html>
        <html lang="en">
        <head>
          <meta charset="UTF-8" />
          <title>My GMod Music Files</title>
          <style>
            body { font-family: "Segoe UI", sans-serif; background: #121212; color: #eee; padding: 2em; }
            h1 { font-size: 1.5em; margin-bottom: 1em; }
            ul { list-style: none; padding: 0; }
            li { margin: 0.25em 0; padding: 0.5em; background: #222; border-radius: 5px; display: flex; align-items: center; }
            a { text-decoration: none; color: #4ea1ff; flex-grow: 1; }
            a:hover { text-decoration: underline; }
            .icon {
              width: 20px;
              height: 20px;
              margin-right: 10px;
              fill: #4ea1ff;
              flex-shrink: 0;
            }
          </style>
        </head>
        <body>
          <h1>Available Music & Video Files</h1>
          <ul>
       EOF
        find . -maxdepth 1 -type f \( -iname "*.mp3" -o -iname "*.wav" -o -iname "*.ogg" -o -iname "*.flac" -o -iname "*.mp4" -o -iname "*.webm" -o -iname "*.jpg" -o -iname "*.jpeg" -o -iname "*.png" \) | sort | while read file; do
          name=$(basename "$file")
          name=$(basename "$file")
          ext="${name##*.}"
          if [[ "$ext" =~ ^(mp3|wav|ogg|flac)$ ]]; then
            icon='<svg class="icon" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3z"/></svg>'
          elif [[ "$ext" =~ ^(mp4|webm)$ ]]; then
            icon='<svg class="icon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>'
          else
            icon='<svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" /></svg>'
          fi
          echo "    <li>$icon<a href=\"$name\">$name</a></li>" >> index.html
        done
        echo "  </ul>" >> index.html
        echo "</body>" >> index.html
        echo "</html>" >> index.html

    - name: Commit and push index.html
      run: |
        git config user.name "github-actions"
        git config user.email "github-actions@github.com"
        git add index.html
        if ! git diff --cached --quiet; then
          git commit -m "Auto-update index.html"
          git pull --rebase origin main
          git push origin HEAD:main
        fi
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
